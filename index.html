<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASTRUT Genève • Calibre A-01</title>
  
  <!-- Importation des polices élégantes (Cormorant Garamond + Montserrat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }
    h1, h2, h3, .font-serif-luxury {
      font-family: 'Cormorant Garamond', serif;
    }
    /* Ombre portée prononcée pour garantir une lisibilité maximale sur la vidéo */
    .text-glow {
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.95), 0 1px 4px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body class="bg-[#1e1e1e] text-white antialiased selection:bg-white selection:text-black overflow-x-hidden">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    function App() {
      const videoRef = useRef(null);
      const [scrollProgress, setScrollProgress] = useState(0);
      const [activeSection, setActiveSection] = useState(0);
      const [isModalOpen, setIsModalOpen] = useState(false);

      const handleScroll = useCallback(() => {
        const totalScroll = document.documentElement.scrollHeight - window.innerHeight;
        if (totalScroll <= 0) return;
        const currentScroll = window.scrollY;
        const progress = Math.min(Math.max(currentScroll / totalScroll, 0), 1);
        setScrollProgress(progress);
        const sectionIndex = Math.min(Math.floor(progress * 4), 3);
        setActiveSection(sectionIndex);

        const video = videoRef.current;
        if (video && video.duration && !isNaN(video.duration)) {
          video.currentTime = progress * video.duration;
        }
      }, []);

      useEffect(() => {
        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, [handleScroll]);

      const scrollToSection = (index) => {
        const totalScroll = document.documentElement.scrollHeight - window.innerHeight;
        const targetScroll = (index / 3) * totalScroll;
        window.scrollTo({ top: targetScroll, behavior: 'smooth' });
      };

      return (
        <div class="relative w-full min-h-screen bg-[#1e1e1e]">
          {/* Arrière-plan vidéo 16:9 */}
          <div class="fixed top-0 left-0 w-full h-full z-0 flex items-center justify-center bg-[#1e1e1e]">
            <div class="relative w-full h-full max-w-6xl max-h-screen aspect-video flex items-center justify-center p-4">
              <video
                ref={videoRef}
                src="vidéo.mp4"
                muted
                playsInline
                preload="auto"
                class="w-full h-full object-cover md:object-contain pointer-events-none"
              />
              <div 
                class="absolute inset-0 pointer-events-none"
                style={{
                  background: 'radial-gradient(circle, transparent 45%, #1e1e1e 85%)'
                }}
              ></div>
            </div>
          </div>

          {/* En-tête */}
          <header class="fixed top-0 left-0 w-full p-8 flex justify-between items-center z-20">
            <div class="text-xs uppercase tracking-[0.4em] font-medium text-white text-glow">
              ASTRUT Genève • Calibre A-01
            </div>
            <div class="text-xs uppercase tracking-[0.3em] font-mono text-white/80 text-glow">
              0{activeSection + 1} / 04
            </div>
          </header>

          {/* Navigation latérale */}
          <nav class="fixed right-8 top-1/2 -translate-y-1/2 z-20 flex flex-col space-y-6">
            {['Astrut', 'Précision', 'Tourbillon', 'Collection'].map((item, idx) => (
              <button
                key={idx}
                onClick={() => scrollToSection(idx)}
                class={`text-right text-[11px] uppercase tracking-[0.3em] transition-all duration-300 text-glow ${
                  activeSection === idx ? 'text-white font-bold scale-110 border-r-2 border-white pr-3' : 'text-white/40 hover:text-white'
                }`}
              >
                {item}
              </button>
            ))}
          </nav>

          {/* Contenu principal avec textes grands et très lisibles */}
          <main class="relative z-10">
            {/* Section 1 */}
            <section class="h-screen flex flex-col justify-center items-center text-center px-4">
              <div class="max-w-3xl text-glow">
                <span class="text-xs uppercase tracking-[0.6em] text-white/90 block mb-4 font-medium">Haute Horlogerie Suisse</span>
                <h1 class="text-6xl md:text-8xl font-light tracking-tight mb-6 text-white leading-none">ASTRUT TIMEPIECE</h1>
                <p class="text-sm md:text-base text-white/90 tracking-widest font-normal mb-8 leading-relaxed max-w-xl mx-auto">
                  La quintessence de l'ingénierie mécanique suisse incarnée dans un boîtier d'exception.
                </p>
                <span class="text-[10px] uppercase tracking-[0.4em] text-white border-t border-b border-white/40 py-3 px-8 inline-block font-medium">
                  Série Limitée : 25 Pièces • Calibre A-01
                </span>
              </div>
            </section>

            {/* Section 2 */}
            <section class="h-screen flex flex-col justify-center items-start px-8 md:px-24">
              <div class="max-w-xl text-glow">
                <span class="text-xs uppercase tracking-[0.6em] text-white/90 block mb-3 font-medium">02 / Architecture & Mécanique</span>
                <h2 class="text-5xl md:text-7xl font-light mb-6 text-white leading-none">L'Art de la<br /><span class="italic font-serif-luxury text-white">Précision</span></h2>
                <p class="text-sm md:text-base text-white/90 tracking-wider font-normal mb-8 leading-relaxed">
                  Chaque composant est façonné et anglé à la main au micron près. Une symbiose parfaite entre tradition séculaire et tolérances nanométriques.
                </p>
                <div class="flex space-x-12 border-t border-white/30 pt-6">
                  <div>
                    <span class="block text-2xl md:text-3xl font-light text-white font-serif-luxury">28,800</span>
                    <span class="text-white/70 uppercase tracking-widest text-[9px] font-medium">Alternances / h</span>
                  </div>
                  <div>
                    <span class="block text-2xl md:text-3xl font-light text-white font-serif-luxury">72H</span>
                    <span class="text-white/70 uppercase tracking-widest text-[9px] font-medium">Réserve de Marche</span>
                  </div>
                </div>
              </div>
            </section>

            {/* Section 3 */}
            <section class="h-screen flex flex-col justify-center items-end text-right px-8 md:px-24">
              <div class="max-w-xl text-glow">
                <span class="text-xs uppercase tracking-[0.6em] text-white/90 block mb-3 font-medium">03 / Complication Majeure</span>
                <h2 class="text-5xl md:text-7xl font-light mb-6 text-white leading-none">Mouvement<br /><span class="italic font-serif-luxury text-white">Tourbillon</span></h2>
                <p class="text-sm md:text-base text-white/90 tracking-wider font-normal leading-relaxed">
                  Une cage volante défiant la gravité terrestre pour une régularité chronométrique absolue. Réalisée en titane poli miroir pesant à peine 0,28 gramme.
                </p>
              </div>
            </section>

            {/* Section 4 */}
            <section class="h-screen flex flex-col justify-center items-center text-center px-4">
              <div class="max-w-2xl text-glow">
                <span class="text-xs uppercase tracking-[0.6em] text-white/90 block mb-4 font-medium">04 / L'Écrin Temporel</span>
                <h2 class="text-5xl md:text-7xl font-light mb-6 text-white leading-none">Découvrir la<br /><span class="italic font-serif-luxury text-white">Collection</span></h2>
                <p class="text-sm md:text-base text-white/90 tracking-wider font-normal mb-10">
                  Acquisition exclusive sur demande privée auprès de nos maîtres horlogers de Genève.
                </p>
                <button
                  onClick={() => setIsModalOpen(true)}
                  class="px-12 py-5 bg-white text-black hover:bg-white/90 text-xs uppercase tracking-[0.35em] font-semibold transition-all duration-300 rounded-none shadow-2xl"
                >
                  Prendre Rendez-vous
                </button>
              </div>
            </section>
          </main>

          {/* Fenêtre modale */}
          {isModalOpen && (
            <div class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div class="bg-[#181818] border border-white/30 p-10 max-w-lg w-full relative text-left rounded-none shadow-2xl">
                <button
                  onClick={() => setIsModalOpen(false)}
                  class="absolute top-5 right-5 text-white/60 hover:text-white text-lg"
                >
                  ✕
                </button>
                <h3 class="text-3xl font-light mb-2 text-white font-serif-luxury">Consultation Privée</h3>
                <p class="text-xs uppercase tracking-wider text-white/70 mb-8">Réservez une présentation confidentielle de la pièce numéro 07/25.</p>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  alert('Votre demande de rendez-vous a été transmise à notre concierge privé.');
                  setIsModalOpen(false);
                }} class="space-y-5 text-sm">
                  <input type="text" placeholder="Nom & Prénom" required class="w-full bg-black/70 border border-white/30 p-4 text-white placeholder-white/50 focus:outline-none focus:border-white" />
                  <input type="email" placeholder="Email Confidentiel" required class="w-full bg-black/70 border border-white/30 p-4 text-white placeholder-white/50 focus:outline-none focus:border-white" />
                  <button type="submit" class="w-full py-4 bg-white text-black font-semibold uppercase tracking-[0.25em] text-xs hover:bg-white/90 transition-colors">
                    Confirmer la demande
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Pied de page */}
          <footer class="fixed bottom-0 left-0 w-full p-6 flex justify-between items-center z-20 text-[10px] uppercase tracking-[0.3em] text-white/60 pointer-events-none text-glow">
            <div>© ASTRUT TIMEPIECE SA</div>
            <div>Progression {Math.round(scrollProgress * 100)}%</div>
            <div>Swiss Made</div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

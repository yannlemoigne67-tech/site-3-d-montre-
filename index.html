<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASTRUT Genève • Calibre A-01</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .text-glow {
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body class="bg-[#1e1e1e] text-white antialiased selection:bg-[#c9a96e] selection:text-black overflow-x-hidden">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    function App() {
      const videoRef = useRef(null);
      const [scrollProgress, setScrollProgress] = useState(0);
      const [activeSection, setActiveSection] = useState(0);
      const [isModalOpen, setIsModalOpen] = useState(false);

      const handleScroll = useCallback(() => {
        const totalScroll = document.documentElement.scrollHeight - window.innerHeight;
        if (totalScroll <= 0) return;
        const currentScroll = window.scrollY;
        const progress = Math.min(Math.max(currentScroll / totalScroll, 0), 1);
        setScrollProgress(progress);
        const sectionIndex = Math.min(Math.floor(progress * 4), 3);
        setActiveSection(sectionIndex);

        const video = videoRef.current;
        if (video && video.duration && !isNaN(video.duration)) {
          video.currentTime = progress * video.duration;
        }
      }, []);

      useEffect(() => {
        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, [handleScroll]);

      const scrollToSection = (index) => {
        const totalScroll = document.documentElement.scrollHeight - window.innerHeight;
        const targetScroll = (index / 3) * totalScroll;
        window.scrollTo({ top: targetScroll, behavior: 'smooth' });
      };

      return (
        <div class="relative w-full min-h-screen font-sans bg-[#1e1e1e]">
          {/* Conteneur vidéo avec fondu de bordure invisible */}
          <div class="fixed top-0 left-0 w-full h-full z-0 flex items-center justify-center bg-[#1e1e1e]">
            <div class="relative w-[70%] h-[70%] max-w-3xl max-h-[70vh] flex items-center justify-center">
              <video
                ref={videoRef}
                src="video.mp4"
                muted
                playsInline
                preload="auto"
                class="w-full h-full object-contain pointer-events-none"
              />
              {/* Masque circulaire pour eliminer les bords du rectangle de la vidéo */}
              <div 
                class="absolute inset-0 pointer-events-none"
                style={{
                  background: 'radial-gradient(circle, transparent 40%, #1e1e1e 80%)'
                }}
              ></div>
            </div>
          </div>

          {/* En-tête */}
          <header class="fixed top-0 left-0 w-full p-8 flex justify-between items-center z-20">
            <div class="text-[11px] uppercase tracking-[0.3em] font-medium text-white/80 text-glow">
              ASTRUT Genève • Calibre A-01
            </div>
            <div class="text-[11px] uppercase tracking-[0.2em] font-mono text-[#c9a96e] text-glow">
              0{activeSection + 1} / 04
            </div>
          </header>

          {/* Navigation latérale */}
          <nav class="fixed right-8 top-1/2 -translate-y-1/2 z-20 flex flex-col space-y-5">
            {['Astrut', 'Précision', 'Tourbillon', 'Collection'].map((item, idx) => (
              <button
                key={idx}
                onClick={() => scrollToSection(idx)}
                class={`text-right text-[10px] uppercase tracking-[0.25em] transition-all duration-300 text-glow ${
                  activeSection === idx ? 'text-[#c9a96e] font-bold scale-105' : 'text-white/40 hover:text-white'
                }`}
              >
                {item}
              </button>
            ))}
          </nav>

          {/* Contenu principal */}
          <main class="relative z-10">
            {/* Section 1 */}
            <section class="h-screen flex flex-col justify-center items-center text-center px-4">
              <div class="max-w-xl text-glow">
                <span class="text-[10px] uppercase tracking-[0.4em] text-[#c9a96e] block mb-3 font-medium">Haute Horlogerie Suisse</span>
                <h1 class="text-4xl md:text-6xl font-extralight tracking-tight mb-4">ASTRUT TIMEPIECE</h1>
                <p class="text-xs text-white/70 tracking-wider font-light mb-6 leading-relaxed">
                  La quintessence de l'ingénierie mécanique suisse incarnée dans un boîtier d'exception.
                </p>
                <span class="text-[9px] uppercase tracking-[0.3em] text-white/40 border-t border-b border-white/10 py-2 px-4 inline-block">
                  Série Limitée : 25 Pièces • Calibre A-01
                </span>
              </div>
            </section>

            {/* Section 2 */}
            <section class="h-screen flex flex-col justify-center items-start px-8 md:px-24">
              <div class="max-w-md text-glow">
                <span class="text-[10px] uppercase tracking-[0.4em] text-[#c9a96e] block mb-3 font-medium">02 / Architecture & Mécanique</span>
                <h2 class="text-3xl md:text-5xl font-extralight mb-4">L'Art de la<br /><span class="italic text-[#e4d5b7]">Précision</span></h2>
                <p class="text-xs text-white/70 tracking-wider font-light mb-6 leading-relaxed">
                  Chaque composant est façonné et anglé à la main au micron près. Une symbiose parfaite entre tradition séculaire et tolérances nanométriques.
                </p>
                <div class="flex space-x-8 text-xs border-t border-white/10 pt-4">
                  <div>
                    <span class="block text-base font-medium text-[#c9a96e]">28,800</span>
                    <span class="text-white/40 uppercase tracking-widest text-[8px]">Alternances / h</span>
                  </div>
                  <div>
                    <span class="block text-base font-medium text-[#c9a96e]">72H</span>
                    <span class="text-white/40 uppercase tracking-widest text-[8px]">Réserve de Marche</span>
                  </div>
                </div>
              </div>
            </section>

            {/* Section 3 */}
            <section class="h-screen flex flex-col justify-center items-end text-right px-8 md:px-24">
              <div class="max-w-md text-glow">
                <span class="text-[10px] uppercase tracking-[0.4em] text-[#c9a96e] block mb-3 font-medium">03 / Complication Majeure</span>
                <h2 class="text-3xl md:text-5xl font-extralight mb-4">Mouvement<br /><span class="italic text-[#e4d5b7]">Tourbillon</span></h2>
                <p class="text-xs text-white/70 tracking-wider font-light leading-relaxed">
                  Une cage volante défiant la gravité terrestre pour une régularité chronométrique absolue. Réalisée en titane poli miroir pesant à peine 0,28 gramme.
                </p>
              </div>
            </section>

            {/* Section 4 */}
            <section class="h-screen flex flex-col justify-center items-center text-center px-4">
              <div class="max-w-xl text-glow">
                <span class="text-[10px] uppercase tracking-[0.4em] text-[#c9a96e] block mb-3 font-medium">04 / L'Écrin Temporel</span>
                <h2 class="text-3xl md:text-5xl font-extralight mb-4">Découvrir la<br /><span class="italic text-[#e4d5b7]">Collection</span></h2>
                <p class="text-xs text-white/70 tracking-wider font-light mb-8">
                  Acquisition exclusive sur demande privée auprès de nos maîtres horlogers de Genève.
                </p>
                <button
                  onClick={() => setIsModalOpen(true)}
                  class="px-8 py-3.5 bg-transparent border border-[#c9a96e] text-[#c9a96e] hover:bg-[#c9a96e] hover:text-black text-[10px] uppercase tracking-[0.25em] font-medium transition-all duration-300 rounded-xs"
                >
                  Prendre Rendez-vous
                </button>
              </div>
            </section>
          </main>

          {/* Modal */}
          {isModalOpen && (
            <div class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div class="bg-[#181818] border border-white/10 p-8 max-w-md w-full relative text-left rounded-lg">
                <button
                  onClick={() => setIsModalOpen(false)}
                  class="absolute top-4 right-4 text-white/50 hover:text-white text-sm"
                >
                  ✕
                </button>
                <h3 class="text-lg font-light mb-1">Consultation Privée</h3>
                <p class="text-[11px] text-white/50 mb-6">Réservez une présentation confidentielle de la pièce numéro 07/25.</p>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  alert('Votre demande de rendez-vous a été transmise à notre concierge privé.');
                  setIsModalOpen(false);
                }} class="space-y-4 text-xs">
                  <input type="text" placeholder="Nom & Prénom" required class="w-full bg-black/50 border border-white/10 p-3 text-white focus:outline-none focus:border-[#c9a96e]" />
                  <input type="email" placeholder="Email Confidentiel" required class="w-full bg-black/50 border border-white/10 p-3 text-white focus:outline-none focus:border-[#c9a96e]" />
                  <button type="submit" class="w-full py-3 bg-[#c9a96e] text-black font-medium uppercase tracking-widest hover:bg-white transition-colors">
                    Confirmer la demande
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Pied de page */}
          <footer class="fixed bottom-0 left-0 w-full p-6 flex justify-between items-center z-20 text-[9px] uppercase tracking-[0.2em] text-white/30 pointer-events-none text-glow">
            <div>© ASTRUT TIMEPIECE SA</div>
            <div>Progression {Math.round(scrollProgress * 100)}%</div>
            <div>Swiss Made</div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
